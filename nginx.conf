# spec-forge — serves the static Angular app. There is no backend, so nothing is
# proxied: this file only has to get the SPA fallback and the cache headers right.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: a deep link or a refresh must resolve to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # App shell: always revalidate so a new build shows up immediately.
    location ~* \.(js|css|json|html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Build assets carry a content hash, so they can be cached hard.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
}
