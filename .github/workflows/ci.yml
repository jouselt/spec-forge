name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:specs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Reads dist/, so it runs after the build and never builds on its own.
      - run: node evals/bundle/run.mjs
      - run: node evals/import/run.mjs
