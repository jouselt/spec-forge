name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build for the Pages subpath
        run: npx ng build --base-href /spec-forge/
      - name: SPA fallback and Jekyll opt-out
        run: |
          cp dist/spec-forge/index.html dist/spec-forge/404.html
          touch dist/spec-forge/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/spec-forge

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
